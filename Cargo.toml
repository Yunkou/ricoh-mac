[package]
name = "nsh-app-ricoh-mac"
version = "0.3.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
security-framework = "3"
thiserror = "2"
exif = { version = "0.6", package = "kamadak-exif" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
xml = "1.4.0"

[[bin]]
name = "mock-camera"
path = "src/bin/mock-camera.rs"

[build-dependencies]
cc = "1"
