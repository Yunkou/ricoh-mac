[package]
name = "nsh-app-ricoh-mac"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
security-framework = "3"
thiserror = "2"

[[bin]]
name = "mock-camera"
path = "src/bin/mock-camera.rs"
