# CI for nsh check, nsh test, and cargo clippy on macOS.
# NSH is installed with the official script pinned to v0.5.1:
#   NSH_VERSION=v0.5.1 curl -fsSL https://nsh.dev/install.sh | sh
# That command is documented at https://nsh.dev/docs/installation/.
# The install step adds $HOME/.local/bin to PATH. If the installer or PATH
# layout changes, the "Install NSH" step will need an update.
#
# Rust build artifacts are cached with Swatinem/rust-cache under the shared key
# "ci". This job only builds the debug profile. The Release packaging job uses a
# separate "release" key, so the two jobs do not store a combined target/
# directory. A combined target/ was about 8.1 GB on an M6 after check, test, and
# package, close to GitHub's 10 GB cache limit. The action drops incremental
# artifacts and unused crates before saving. This job writes the cache only from
# main, so pull requests do not add extra entries. The cache key includes
# Cargo.lock, the Rust toolchain, and NSH_VERSION.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NSH_VERSION: v0.5.1
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: nsh check and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ci
          env-vars: NSH_VERSION
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install NSH
        env:
          NSH_VERSION: ${{ env.NSH_VERSION }}
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          command -v nsh
          nsh --version
          rustc --version
          cargo --version

      - name: Format
        run: make fmt

      - name: Check
        run: make check

      - name: Test
        run: make test

      - name: Clippy
        run: make clippy
