# Publish a macOS app archive to a GitHub Release when a version tag is pushed.
# NSH is installed with the official script pinned to v0.5.1:
#   NSH_VERSION=v0.5.1 curl -fsSL https://nsh.dev/install.sh | sh
# That command is documented at https://nsh.dev/docs/installation/.
#
# Packaging starts as soon as the tag is pushed. Publishing waits until
# packaging succeeds and a quality gate has passed for the same commit: a
# successful CI run if one exists or is still running, or the same check, test,
# and clippy steps if CI has not run. The packaging job does not repeat those
# checks.
#
# Rust build artifacts are cached with Swatinem/rust-cache, split by job
# profile: this workflow stores the release build under the "release" key, and
# CI stores the debug build under "ci". A combined target/ directory was about
# 8.1 GB on an M6 after check, test, and package, close to GitHub's 10 GB cache
# limit. The action also drops incremental artifacts and unused crates before
# saving. CI writes its cache only from main. The cache key includes Cargo.lock,
# the Rust toolchain, and NSH_VERSION.
#
# workflow_dispatch rebuilds an existing tag with this workflow file (from the
# branch you run it on) and uploads the archive to that tag's Release. The
# application is always packaged from the tag's commit.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to package and publish, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NSH_VERSION: v0.5.1
  CARGO_TERM_COLOR: always
  RICOH_MAC_NO_WIFI_SWITCH: "1"
  TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  package:
    name: Package the macOS archive
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - name: Require an arm64 runner
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [[ "$arch" != "arm64" ]]; then
            echo "This release is published as macos-arm64, but the runner architecture is ${arch}." >&2
            exit 1
          fi

      - name: Check that the tag matches nsh.json and Cargo.toml
        run: python3 scripts/release-version.py --tag "$TAG"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release
          env-vars: NSH_VERSION

      - name: Install NSH
        env:
          NSH_VERSION: ${{ env.NSH_VERSION }}
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          command -v nsh
          nsh --version
          rustc --version
          cargo --version

      - name: Package the macOS archive
        run: make dist TAG="$TAG"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-archive
          path: |
            dist/ricoh-mac-${{ env.TAG }}-macos-arm64.zip
            dist/ricoh-mac-${{ env.TAG }}-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      ci_result: ${{ steps.wait.outputs.ci_result }}
    steps:
      - name: Check out the workflow scripts
        uses: actions/checkout@v5

      - name: Wait for a passing CI run on the tag commit
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/wait-for-ci.py --tag "$TAG"

  quality-tests:
    name: Run checks when CI has not run
    needs: quality-gate
    if: needs.quality-gate.outputs.ci_result == 'missing'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ci
          env-vars: NSH_VERSION
          save-if: "false"

      - name: Install NSH
        env:
          NSH_VERSION: ${{ env.NSH_VERSION }}
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          command -v nsh
          nsh --version
          rustc --version
          cargo --version

      - name: Format
        run: make fmt

      - name: Check
        run: make check

      - name: Test
        run: make test

      - name: Clippy
        run: make clippy

  publish:
    name: Publish the GitHub Release
    needs: [package, quality-gate, quality-tests]
    if: >
      always() &&
      !cancelled() &&
      needs.package.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      (needs.quality-tests.result == 'success' || needs.quality-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - name: Download the archive
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-archive
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip="dist/ricoh-mac-${TAG}-macos-arm64.zip"
          sum="${zip}.sha256"
          if [[ ! -f "$zip" || ! -f "$sum" ]]; then
            echo "Expected $zip and $sum from make dist." >&2
            exit 1
          fi
          hash="$(awk '{print $1}' "$sum")"
          zip_name="$(basename "$zip")"
          channel="$(python3 scripts/release-version.py --tag "$TAG" --print-channel)"
          channel_args=()
          if [[ "$channel" == "prerelease" ]]; then
            channel_args+=(--prerelease)
          fi

          notes="$(mktemp)"
          preamble="$(sed -e "s/__ZIP_NAME__/${zip_name}/g" -e "s/__SHA256__/${hash}/g" scripts/release-notes-preamble.md)"
          printf '%s\n' "$preamble" > "$notes"
          commit="$(git rev-parse HEAD)"
          if body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="${commit}" --jq .body)"; then
            if [[ -n "$body" ]]; then
              printf '\n---\n\n%s\n' "$body" >> "$notes"
            fi
          fi

          # Bash 3.2 (the macOS /bin/bash) errors on "${array[@]}" when the
          # array is empty and set -u is on. The ${array[@]+...} form expands
          # to nothing for an empty array and to the arguments when set.
          # The Releases API treats --target as target_commitish. If that
          # commit's .github/workflows/ tree differs from the default branch,
          # POST /releases requires workflows:write, which GITHUB_TOKEN cannot
          # be given. See GitHub REST docs "Create a release" and cli/cli#9514.
          # When the tag already exists, target_commitish is unused; omit
          # --target and attach the release to that tag.
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "Refusing to create a release: tag ${TAG} is not present in this checkout." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ricoh-mac ${TAG}" --notes-file "$notes" ${channel_args[@]+"${channel_args[@]}"}
            gh release upload "$TAG" "$zip" "$sum" --clobber
          else
            create_args=(--title "ricoh-mac ${TAG}" --notes-file "$notes")
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              create_args+=(--verify-tag)
            fi
            gh release create "$TAG" "$zip" "$sum" ${create_args[@]+"${create_args[@]}"} ${channel_args[@]+"${channel_args[@]}"}
          fi
