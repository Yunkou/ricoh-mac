# Publish a macOS app archive to a GitHub Release when a version tag is pushed.
# NSH is installed with the official script pinned to v0.5.1:
#   NSH_VERSION=v0.5.1 curl -fsSL https://nsh.dev/install.sh | sh
# That command is documented at https://nsh.dev/docs/installation/.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NSH_VERSION: v0.5.1
  CARGO_TERM_COLOR: always
  RICOH_MAC_NO_WIFI_SWITCH: "1"

jobs:
  release:
    name: Package and publish
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require an arm64 runner
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [[ "$arch" != "arm64" ]]; then
            echo "This release is published as macos-arm64, but the runner architecture is ${arch}." >&2
            exit 1
          fi

      - name: Check that the tag matches nsh.json and Cargo.toml
        run: python3 scripts/release-version.py --tag "${{ github.ref_name }}"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install NSH
        env:
          NSH_VERSION: ${{ env.NSH_VERSION }}
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          command -v nsh
          nsh --version
          rustc --version
          cargo --version

      - name: Format
        run: make fmt

      - name: Check
        run: make check

      - name: Test
        run: make test

      - name: Clippy
        run: make clippy

      - name: Package the macOS archive
        run: make dist TAG="${{ github.ref_name }}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="dist/ricoh-mac-${TAG}-macos-arm64.zip"
          sum="${zip}.sha256"
          if [[ ! -f "$zip" || ! -f "$sum" ]]; then
            echo "Expected $zip and $sum from make dist." >&2
            exit 1
          fi
          hash="$(awk '{print $1}' "$sum")"
          zip_name="$(basename "$zip")"
          channel="$(python3 scripts/release-version.py --tag "$TAG" --print-channel)"
          channel_args=()
          if [[ "$channel" == "prerelease" ]]; then
            channel_args+=(--prerelease)
          fi

          notes="$(mktemp)"
          preamble="$(sed -e "s/__ZIP_NAME__/${zip_name}/g" -e "s/__SHA256__/${hash}/g" scripts/release-notes-preamble.md)"
          printf '%s\n' "$preamble" > "$notes"
          if body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="${GITHUB_SHA}" --jq .body)"; then
            if [[ -n "$body" ]]; then
              printf '\n---\n\n%s\n' "$body" >> "$notes"
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ricoh-mac ${TAG}" --notes-file "$notes" "${channel_args[@]}"
            gh release upload "$TAG" "$zip" "$sum" --clobber
          else
            gh release create "$TAG" "$zip" "$sum" --title "ricoh-mac ${TAG}" --notes-file "$notes" --verify-tag "${channel_args[@]}"
          fi
